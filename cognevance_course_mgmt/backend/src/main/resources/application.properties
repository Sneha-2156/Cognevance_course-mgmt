# Server
server.port=8080

# MySQL connection - use env vars in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/course_mgmt_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT - CHANGE jwt.secret before deploying (32+ random characters, keep it out of source control)
jwt.secret=${JWT_SECRET:this-is-a-dev-only-secret-key-change-it-before-deploying}
jwt.expiration-ms=86400000

logging.level.org.springframework.security=INFO
